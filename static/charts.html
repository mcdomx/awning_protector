<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charts — Awning Protector</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/logs.css" />
  <link rel="stylesheet" href="/static/charts.css" />
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script defer src="/static/charts.js"></script>
</head>
<body>
  <header>
    <h1>Awning Protector</h1>
    <span id="connection-status" class="badge badge-offline">Connecting…</span>
    <nav class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/logs/automation-page">Automation Log</a>
      <a href="/logs/weather-page">Weather Log</a>
      <a href="/charts" class="active">Charts</a>
    </nav>
  </header>

  <div class="log-toolbar">
    <div class="filter-group">
      <label for="time-window">Window</label>
      <select id="time-window">
        <option value="900000">Last 15 min</option>
        <option value="3600000" selected>Last 1 hour</option>
        <option value="10800000">Last 3 hours</option>
        <option value="21600000">Last 6 hours</option>
        <option value="43200000">Last 12 hours</option>
        <option value="86400000">Last 24 hours</option>
      </select>
    </div>
    <label class="auto-refresh-label">
      <input type="checkbox" id="show-lux" />
      Show lux
    </label>
    <span class="muted chart-note">Forecast (dotted) is 3-hour granularity; wind &amp; temp only.</span>
  </div>

  <div class="chart-container">
    <canvas id="trend-chart"></canvas>
  </div>
</body>
</html>
